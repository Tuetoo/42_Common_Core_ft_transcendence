# Development overrides (picked up automatically by `docker compose`):
# the services run from the `development` image stage with the source
# bind-mounted, so a code change needs `docker compose restart <service>`.
#
# The `development` stage's CMD runs uvicorn WITHOUT --reload: a reload
# watches the whole /app tree, so editing any file would restart the
# service and kill in-progress work (background analyses, WebSocket
# connections, in-memory Yjs rooms).

services:
  auth-service:
    build:
      target: development
    volumes:
      - ./shared:/app/shared
      - ./services/auth-service:/app
      - avatar_data:/app/data/avatars

  core-service:
    build:
      target: development
    volumes:
      - ./shared:/app/shared
      - ./services/core-service:/app

  ai-service:
    build:
      target: development
    volumes:
      - ./shared:/app/shared
      - ./services/ai-service:/app
    environment:
      LOG_LEVEL: "DEBUG"
