apiVersion: 1

# Runs at every start: removes any datasource named Prometheus (a
# grafana_data volume may hold one with another uid), so the one below is
# always created with the fixed uid "Prometheus".
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # Fixed uid -- the provisioned dashboards reference
    # the datasource as {"type": "prometheus", "uid": "Prometheus"}.
    uid: Prometheus
    type: prometheus
    access: proxy
    # Container-to-container URL on the compose network (Prometheus has no
    # route prefix; its UI is only published on 127.0.0.1:9090).
    url: http://prometheus:9090
    isDefault: true
    editable: false
