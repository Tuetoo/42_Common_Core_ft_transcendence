# Alertmanager configuration for AlphaMind.
#
# Every alert goes to one email receiver. In development the SMTP server
# is the stack's MailHog container (plain SMTP on mailhog:1025, no auth,
# no TLS), so alert emails appear in the MailHog web UI
# (http://127.0.0.1:8025) instead of a real inbox.
#
# Alertmanager does NOT expand environment variables in this file, so the
# addresses below are fixed values:
# - `to` defaults to the placeholder alerts@alphamind.local, which only
#   exists inside MailHog. To send alerts to a real person, edit
#   `receivers[0].email_configs[0].to` (several addresses: comma
#   separated) and restart the container:
#     docker compose --env-file .env.docker restart alertmanager
# - For a real SMTP provider, change smarthost / auth_username /
#   auth_password (or auth_password_file) and set require_tls: true.
#   Do not commit real credentials.
#
# Check locally:  amtool check-config infra/alertmanager/alertmanager.yml

global:
  smtp_smarthost: "mailhog:1025"
  smtp_from: "AlphaMind Alertmanager <alertmanager@alphamind.local>"
  smtp_require_tls: false
  resolve_timeout: 5m

route:
  receiver: email
  group_by: ["alertname", "service"]
  # Wait a little so alerts that fire together arrive in one email.
  group_wait: 30s
  group_interval: 5m
  # Re-send a still-firing alert every 4 hours.
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: "alerts@alphamind.local"
        send_resolved: true

# While a service is down, do not also send the latency / error-rate
# warnings it causes.
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["service"]
