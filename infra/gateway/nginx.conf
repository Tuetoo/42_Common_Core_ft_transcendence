worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Do not advertise the nginx version in the Server
    # header or on error pages.
    server_tokens off;

    # Redirects that nginx itself generates (for example
    # a missing trailing slash) stay relative. An absolute redirect
    # would be built with the container's own port (443), not the
    # published host port (8443), and would send the browser nowhere.
    absolute_redirect off;

    # Nginx's own default (1m) is well below what a real research
    # document upload needs -- confirmed for real: a 2.9MB earnings-deck
    # PDF (images-heavy slide deck, not just text) got rejected with a
    # bare 413 before this was raised. Applied at the http block (not
    # just the /api/v1/research location) since api-key uploads
    # (avatars, etc.) have the same underlying constraint and there's no
    # benefit to a tighter per-route limit here. 25m comfortably covers
    # realistic filing/earnings-deck PDFs; MinIO/S3 and each service's
    # own body-size handling aren't affected by this -- this only
    # controls what the gateway itself will forward.
    client_max_body_size 25m;

    # nginx resolves a plain hostname in `proxy_pass` (or in a static
    # `upstream {}` block) only once, when the worker starts. After a
    # backend container is recreated with a new internal IP, nginx
    # would keep routing to the stale IP, which Docker may have given
    # to a different container.
    #
    # `resolver` + a variable in `proxy_pass` (below) makes nginx
    # re-resolve the hostname via Docker's embedded DNS (127.0.0.11 on
    # any user-defined bridge network) every `valid` seconds. Do not
    # use static `upstream {}` blocks: they do not support this.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Access log without query strings. The WebSocket
    # endpoint receives the JWT as `/ws/...?token=<jwt>` and the OAuth
    # callback receives `?code=...&state=...`; the default "combined"
    # format logs $request (which includes the query string), which
    # would put those secrets into the container logs (and into ./logs
    # via the vector service). No route takes a secret in its path; the
    # services strip query strings from their own uvicorn logs
    # (shared/logging.py). This format logs the method, the normalised path
    # ($uri, never $args) and the protocol instead. Used for every
    # server and location, which is a superset of "not for /ws".
    # Note: nginx's error log still prints the raw request line when an
    # upstream fails; that is a much rarer path and is accepted here.
    log_format main_noargs '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "$http_user_agent" '
                           'rt=$request_time';
    access_log /var/log/nginx/access.log main_noargs;

    # Gateway-level rate limit for /api/v1/auth/ as
    # defence in depth (auth-service has its own per-account/per-IP
    # limits in Redis). Keyed on the client address that nginx sees;
    # behind Docker Desktop all host traffic can share one address, so
    # the burst is generous on purpose.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    limit_req_status 429;

    # WebSocket upgrade. "Connection: upgrade" only when
    # the client actually asked for an upgrade, "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Forward the Host header WITH the external port
    # (for example "localhost:8443"). With plain $host the port was
    # dropped, so URLs the backends build (FastAPI slash redirects,
    # Grafana's origin check on login) pointed at https://localhost/
    # (port 443) instead of the published port.
    map $http_host $proxy_host_header {
        ''      $host;
        default $http_host;
    }

    # Security headers. They are all set at http level
    # (and nowhere else) because any add_header in a server or location
    # block silently drops every inherited add_header. Per-path values
    # are chosen with map instead; an empty value means the header is
    # not sent.
    map $uri $frame_options {
        # Grafana panels may be embedded by Grafana itself.
        ~^/grafana(/|$)  SAMEORIGIN;
        default          DENY;
    }
    # Conservative CSP for the static status page only (the API returns
    # JSON, Swagger and Grafana ship their own inline scripts). The two
    # hashes are the SHA-256 of the exact <script> and <style> bodies in
    # infra/gateway/status.html. After editing either block, run
    # `python3 infra/gateway/csp_hashes.py --write` (CI runs --check).
    map $uri $content_security_policy {
        # try_files rewrites $uri to /status.html before the headers
        # are sent, so both spellings are matched.
        ~^/status(\.html)?$  "default-src 'none'; script-src 'sha256-MVTsSAtUtCXaPyO2kQmT5BOrBd+w4r79F6KN2bGhe6c='; style-src 'sha256-UhRAusrh4IV8C/aXR7OqIYTQUf+lU6fWGdtaucwCyME='; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
        default   "";
    }
    # HSTS (one year). Browsers ignore it on plain http and on
    # connections with certificate errors (RFC 6797 section 8.1), so
    # the self-signed development certificate does not pin localhost
    # to https unless the certificate was explicitly trusted.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $frame_options always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $content_security_policy always;

    # Proxy headers for every proxied location. These
    # are inherited by each location below unless that location sets
    # its own proxy_set_header (then it must repeat all of them, see
    # /ws and /grafana/). uvicorn runs with --proxy-headers so
    # request.client.host / request.url.scheme reflect these.
    # X-Forwarded-For is REPLACED with the peer address, never appended
    # to. The gateway is the edge, and uvicorn (--forwarded-allow-ips=*)
    # takes the left-most entry, so an appended header would let a client
    # choose its own address and bypass (or target another user's)
    # per-IP rate limits in auth-service.
    proxy_set_header Host $proxy_host_header;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $proxy_host_header;
    # The gateway's security headers (above) are the only copies sent;
    # an upstream's own values would otherwise appear twice.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;

    # Plain http (container port 80, published as host
    # 8000) only redirects to https. The external https port is not
    # visible to nginx inside the container, so it is set here; keep it
    # in sync with the gateway's "8443:443" mapping in
    # docker-compose.yaml (a map, not `set`, so it is also available
    # to error_page 497 below, which runs before the rewrite phase).
    map $host $external_https_port {
        default 8443;
    }

    server {
        listen 80;
        return 301 https://$host:$external_https_port$request_uri;
    }

    server {
        listen 443 ssl;
        # HTTP/2 is left off on purpose: WebSocket upgrades (/ws,
        # Grafana live) use HTTP/1.1, and the `http2` directive syntax
        # differs between nginx 1.24 and 1.27.

        # Self-signed development certificate generated
        # by infra/gateway/gen-certs.sh (`make certs`), mounted read-only.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" cipher list (TLSv1.2 only; TLSv1.3
        # suites are not configurable here and are all strong).
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # A plain-http request sent to the https port gets nginx's
        # internal 497 status; redirect it to https instead.
        error_page 497 =301 https://$host:$external_https_port$request_uri;

        # Re-evaluated per request (nginx variables are request-scoped
        # even when `set` at server level), so each of these re-runs
        # through `resolver` above rather than being resolved once.
        set $auth_service auth-service:8000;
        set $core_service core-service:8000;
        set $ai_service ai-service:8000;
        set $grafana_service grafana:3000;

        # Anything not listed below is a 404 at the
        # gateway. This keeps /internal/* (service-to-service only) and
        # /metrics (scraped by Prometheus inside the Docker network)
        # unreachable from outside. The explicit blocks document intent;
        # the catch-all covers everything else (the frontend will take
        # over `location /` once it exists).
        location ^~ /internal/ {
            return 404;
        }
        location = /internal {
            return 404;
        }
        location = /metrics {
            return 404;
        }
        location / {
            return 404;
        }

        # Public status page (static, no backend call on
        # the server side; the page itself fetches /health/*).
        location = /status {
            root /usr/share/nginx/status;
            try_files /status.html =404;
            default_type text/html;
            charset utf-8;
            expires -1;
        }

        # auth-service
        location /api/v1/auth {
            # 10 requests/second per client address with
            # a burst of 20, answered 429 beyond that.
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass http://$auth_service;
        }
        location /api/v1/organizations {
            proxy_pass http://$auth_service;
        }
        location /api/v1/connections {
            proxy_pass http://$auth_service;
        }
        # User administration and site statistics.
        location /api/v1/admin {
            proxy_pass http://$auth_service;
        }
        location /static/avatars {
            proxy_pass http://$auth_service;
        }

        # core-service
        location /api/v1/portfolios {
            proxy_pass http://$core_service;
        }
        location /api/v1/watchlists {
            proxy_pass http://$core_service;
        }
        location /api/v1/api-keys {
            proxy_pass http://$core_service;
        }
        location /api/v1/research {
            proxy_pass http://$core_service;
        }
        location /api/v1/notifications {
            proxy_pass http://$core_service;
        }
        location /api/v1/public {
            proxy_pass http://$core_service;
        }
        # Hide/unhide/delete of notes and comments.
        location /api/v1/moderation {
            proxy_pass http://$core_service;
        }
        location /ws {
            proxy_pass http://$core_service;
            proxy_http_version 1.1;
            # Setting any proxy_set_header here drops the inherited
            # ones, so all of them are repeated.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $proxy_host_header;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $proxy_host_header;
            proxy_read_timeout 3600s;
        }

        # ai-service
        location /api/v1/analyses {
            proxy_pass http://$ai_service;
        }
        location /api/v1/market {
            proxy_pass http://$ai_service;
        }
        location /api/v1/analytics {
            proxy_pass http://$ai_service;
        }
        location /api/v1/decisions {
            proxy_pass http://$ai_service;
        }
        location /api/v1/backtests {
            proxy_pass http://$ai_service;
        }
        # RAG questions; /ask/stream is Server-Sent
        # Events, so tokens must be forwarded as they arrive (no buffering)
        # and a long answer must not hit the default 60 s read timeout.
        location /api/v1/rag {
            proxy_pass http://$ai_service;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
        }

        # Grafana behind the gateway at /grafana/
        # (GF_SERVER_ROOT_URL + GF_SERVER_SERVE_FROM_SUB_PATH in
        # docker-compose.yaml), so the /grafana prefix is passed through
        # unchanged. Upgrade headers are needed for Grafana Live.
        location = /grafana {
            return 301 /grafana/;
        }
        location /grafana/ {
            proxy_pass http://$grafana_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $proxy_host_header;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $proxy_host_header;
            # Grafana sends its own copies of these; the gateway's
            # values (above) are the ones that must win, not a
            # duplicated pair of conflicting headers. (proxy_hide_header
            # is inherited from http level too; repeated for clarity.)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
        }

        # Swagger docs
        location /docs/auth/ {
            proxy_pass http://$auth_service/api/docs;
        }
        location /docs/core/ {
            proxy_pass http://$core_service/api/docs;
        }
        location /docs/ai/ {
            proxy_pass http://$ai_service/api/docs;
        }

        # Each Swagger page above fetches its OpenAPI spec from FastAPI's
        # `openapi_url`, which is embedded as an ABSOLUTE url, so the
        # browser requests it from this gateway's root, not from the
        # backend that served the page. Each service therefore uses a
        # unique path ("/api/openapi-<service>.json", set in its
        # main.py's FastAPI() call) so nginx can route them separately.
        location = /api/openapi-auth.json {
            proxy_pass http://$auth_service;
        }
        location = /api/openapi-core.json {
            proxy_pass http://$core_service;
        }
        location = /api/openapi-ai.json {
            proxy_pass http://$ai_service;
        }

        # health aggregation (also read by the /status page)
        location = /health/auth {
            proxy_pass http://$auth_service/health;
        }
        location = /health/core {
            proxy_pass http://$core_service/health;
        }
        location = /health/ai {
            proxy_pass http://$ai_service/health;
        }

        # /internal/* is intentionally NOT proxied here -- it is only
        # reachable on the Docker-internal network, service to service
        # (see the explicit 404 blocks above).
    }
}
