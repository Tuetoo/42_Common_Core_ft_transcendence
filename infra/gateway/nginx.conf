worker_processes auto;

events {
    worker_processes 1024;
}

http {
    upstream auth_service {
        server auth-service:8000;
    }
    upstream core_service {
        server core-service:8000;
    }
    upstream ai_service {
        service ai_service:8000;
    }
}

server {
    listen 80;
    # auth-service
    location /api/v1/auth/{
        proxy_pass http://auth_service/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/v1/organizations/ {
        proxy_pass http://auth_service/api/v1/organizations/;
        proxy_set_header Host $host;
    }
    location /api/v1/connections/ {
        proxy_pass http://auth_service/api/v1/connections/;
        proxy_set_header Host $host;
    }

    # core-service
    location /api/v1/portfolios/ {
        proxy_pass http://core_service/api/v1/portfolios/;
        proxy_set_header Host $host;
    }
    location /api/v1/research/ {
        proxy_pass http://core_service/api/v1/research/;
        proxy_set_header Host $host;
    }
    location /api/v1/notifications/ {
        proxy_pass http://core_service/api/v1/notifications/;
        proxy_set_header Host $host;
    }
    location /api/v1/public/ {
        proxy_pass http://core_service/api/v1/public/;
        proxy_set_header Host $host
    }
    location /ws/ {
        proxy_pass http://core_service/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    # ai-service
    location /api/v1/analyses/ {
        proxy_pass http://ai_service/api/v1/analyses/;
        proxy_set_header Host $host;
    }
    location /api/v1/market/ {
        proxy_pass http://ai_service/api/v1/market/;
        proxy_set_header Host $host;
    }
    location /api/v1/analytics/ {
        proxy_pass http://ai_service/api/v1/analytics/;
        proxy_set_header Host $host;
    }
    # Swagger docs
    location /docs/auth/ {
        proxy_pass http://auth_service/api/docs;
    }
    location /docs/core/ {
        proxy_pass http://core_service/api/docs;
    }
    location /docs/ai/ {
        proxy_pass http://ai_service/api/docs;
    }
    # health aggregation
    location = /health/auth {
        proxy_pass http://auth_service/health;
    }
    location = /health/core {
        proxy_pass http://core_service/health;
    }
    location = /health/ai {
        proxy_pass http://ai_service/health;
    }
}