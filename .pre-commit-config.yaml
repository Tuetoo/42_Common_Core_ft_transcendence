repos:
  # Ruff (Lint + Format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Common Git Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  # MyPy
  - repo: local
    hooks:
      - id: mypy-ai
        name: mypy ai-service
        entry: uv run mypy services/ai-service
        language: system
        pass_filenames: false

      - id: mypy-auth
        name: mypy auth-service
        entry: uv run mypy services/auth-service
        language: system
        pass_filenames: false

      - id: mypy-core
        name: mypy core-service
        entry: uv run mypy services/core-service
        language: system
        pass_filenames: false

      - id: mypy-shared
        name: mypy shared
        entry: uv run mypy shared
        language: system
        pass_filenames: false