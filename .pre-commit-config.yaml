repos:
  # Ruff (Lint + Format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Common Git Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  # MyPy
  # Same real repro/reasoning as Makefile's `lint` target (2026-08-13)
  # -- `shared`/`auth-service` run directly against their path from
  # the repo root; `core-service`/`ai-service` must `cd` into
  # themselves first. Not a stylistic choice, all four shapes were
  # actually tried against all four targets; only this combination is
  # mypy-clean on every one.
  - repo: local
    hooks:
      - id: mypy-ai
        name: mypy ai-service
        entry: bash -c 'ROOT="$(pwd)"; cd services/ai-service && MYPYPATH="$ROOT" uv run mypy --explicit-package-bases .'
        language: system
        pass_filenames: false

      - id: mypy-auth
        name: mypy auth-service
        entry: bash -c 'MYPYPATH="$(pwd)" uv run mypy --explicit-package-bases services/auth-service'
        language: system
        pass_filenames: false

      - id: mypy-core
        name: mypy core-service
        entry: bash -c 'ROOT="$(pwd)"; cd services/core-service && MYPYPATH="$ROOT" uv run mypy --explicit-package-bases .'
        language: system
        pass_filenames: false

      - id: mypy-shared
        name: mypy shared
        entry: bash -c 'MYPYPATH="$(pwd)" uv run mypy --explicit-package-bases shared'
        language: system
        pass_filenames: false