name: auth-service CI

# Real test/lint/type-check gates. Tests use
# testcontainers (tests/auth-service/conftest.py starts its own Postgres
# and Redis through the runner's Docker daemon), so no `services:` block
# is needed.
# The paths are everything the suite, its lint and its type check read:
# the shared test helpers, the Makefile targets the steps call, and the
# repository files the tests check.
on:
  push:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - "shared/**"
      - "tests/auth-service/**"
      - "tests/alembic_contract.py"
      - "tests/auth_tokens.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/auth-service-ci.yml"
  pull_request:
    paths:
      - "services/auth-service/**"
      - "shared/**"
      - "tests/auth-service/**"
      - "tests/alembic_contract.py"
      - "tests/auth_tokens.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/auth-service-ci.yml"

# Read-only token: no job writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Flake8
        run: >-
          uv run flake8 --extend-exclude mistral_provider.py
          services/auth-service shared tests/auth-service
      - name: Mypy
        run: make mypy-shared mypy-auth
      - name: Tests
        run: make test-auth
      - name: Build image
        run: docker build -f services/auth-service/Dockerfile --target production -t auth-service:ci .
