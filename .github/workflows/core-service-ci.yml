name: core-service CI

# Real test/lint/type-check gates. Tests use
# testcontainers (tests/core-service/conftest.py starts its own Postgres
# and Redis through the runner's Docker daemon), so no `services:` block
# is needed.
# The paths are everything the suite, its lint and its type check read:
# the shared test helpers, the Makefile targets the steps call, and the
# repository files the tests check.
on:
  push:
    branches: [main]
    paths:
      - "services/core-service/**"
      - "shared/**"
      - "tests/core-service/**"
      - "tests/alembic_contract.py"
      - "tests/auth_tokens.py"
      - "Makefile"
      - "infra/scheduler/**"
      - "infra/gateway/nginx.conf"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/prometheus/alert_rules.yml"
      - ".github/workflows/core-service-ci.yml"
  pull_request:
    paths:
      - "services/core-service/**"
      - "shared/**"
      - "tests/core-service/**"
      - "tests/alembic_contract.py"
      - "tests/auth_tokens.py"
      - "Makefile"
      - "infra/scheduler/**"
      - "infra/gateway/nginx.conf"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/prometheus/alert_rules.yml"
      - ".github/workflows/core-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - name: Flake8
        run: >-
          uv run flake8 --extend-exclude mistral_provider.py
          services/core-service shared tests/core-service
      - name: Mypy
        run: make mypy-shared mypy-core
      - name: Tests
        run: make test-core
      - name: Build image
        run: docker build -f services/core-service/Dockerfile --target production -t core-service:ci .
