# Continuous deployment to the cloud host (docs/DEPLOYMENT.md).
# Runs after "stack smoke CI" succeeded for a push to main, so only a
# main that builds and starts as a whole stack is deployed; it can also
# be started by hand (Actions -> deploy -> Run workflow).
# The job only opens an SSH connection: the host's authorized_keys entry
# for this key forces `bash scripts/deploy.sh`, so the key can do nothing
# else. Repository secrets: DEPLOY_HOST (host name), DEPLOY_SSH_KEY
# (private key) and DEPLOY_KNOWN_HOSTS (`ssh-keyscan -t ed25519 <host>`).
name: deploy

on:
  workflow_run:
    workflows: ["stack smoke CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o ServerAliveInterval=30 "ubuntu@$DEPLOY_HOST"
