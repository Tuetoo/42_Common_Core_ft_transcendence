[project]
name = "alphamind"
version = "0.1.0"
description = "AlphaMind AI Investment Research Platform"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "redis>=6.2",
    "qdrant-client>=1.15",
    "edgartools>=5.48",
    "langgraph>=0.5",
    "openai>=1.97",
    "anthropic>=0.58",
    "mistralai>=1.9",
    "google-genai>=1.28",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.10",
    # FastAPI's Form(...)/UploadFile parameters (avatar upload,
    # research document upload) need this; FastAPI itself doesn't
    # declare it as a hard dependency since not every app uses forms.
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.5",
    "passlib[bcrypt]>=1.7",
    # passlib is unmaintained and incompatible with bcrypt>=4.1 (that
    # release removed the __about__ attribute passlib relies on and
    # raises on passwords over 72 bytes, which breaks passlib's own
    # self-test at import time), so bcrypt is pinned below 4.1.
    "bcrypt<4.1",
    "pyotp>=2.9",
    "httpx>=0.28",
    "structlog>=25.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "websockets>=12.0",
    # Email (shared/email.py) -- vendor-agnostic async SMTP client.
    "aiosmtplib>=3.0",
    # Yjs collaborative editing (core-service's yjs_relay.py) --
    # Python bindings for the Rust Yrs CRDT implementation.
    "y-py>=0.6,!=0.6.2",
    # RAG hybrid search: lexical (BM25) side of BM25 + Qdrant + RRF.
    "bm25s>=0.2",
    # Real market-data / fundamentals / macro providers (ai-service).
    "yfinance>=0.2",
    # Object storage (SeaweedFS in Docker, real S3/R2 elsewhere) --
    # shared/storage.py. Real AWS SDK, works against any S3-compatible
    # endpoint via endpoint_url.
    "boto3>=1.35",
    # PDF text extraction (ai/rag/chunking.py::parse_document).
    # Pure-Python, BSD-licensed -- chosen over pymupdf/fitz (AGPL).
    "pypdf>=5.0",
]

[dependency-groups]

dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    # Spins up a real, throwaway Postgres container per test session --
    # needed because tests exercise Postgres-specific features (TSVECTOR
    # full-text search, GENERATED ALWAYS AS columns, SELECT FOR UPDATE
    # row locking) that a SQLite in-memory DB can't reproduce.
    "testcontainers[postgres]>=4.8",
    "flake8>=7.3",
    "mypy>=1.17",
    "types-python-jose>=3.5.0.20260408",
    "types-passlib>=1.7.7.20260211",
    "boto3-stubs[s3]>=1.43.106",
]

[tool.isort]
line_length = 79
multi_line_output = 0
no_lines_before = ["STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["domains", "shared", "tests"]

[tool.mypy]

python_version = "3.11"

strict = true

warn_unused_configs = true

warn_return_any = true

disallow_untyped_defs = true

# Required alongside running mypy from *inside* each target directory
# (see the Makefile's `lint` target): without it, same-named files in
# different subpackages (most directories have no `__init__.py`) are
# reported as "Duplicate module" errors.
# MYPYPATH (the repo root) must still be set per invocation so that
# `shared.*` imports resolve as a real package rather than as `Any`;
# an absolute path cannot be set portably in this file.
explicit_package_bases = true

[tool.pyright]
# Editor import resolution only (Pylance in VS Code reads this section).
# Each service and its tests import the service's own top-level modules
# (config, database, domains, ...) and the repository-root `shared`
# package, the same paths tests/*/conftest.py puts on sys.path. mypy
# --strict remains the type checker, so pyright's own checks stay off.
typeCheckingMode = "off"
venvPath = "."
venv = ".venv"
executionEnvironments = [
  { root = "services/auth-service", extraPaths = ["."] },
  { root = "services/core-service", extraPaths = ["."] },
  { root = "services/ai-service", extraPaths = ["."] },
  { root = "tests/auth-service", extraPaths = ["services/auth-service", "tests", "."] },
  { root = "tests/core-service", extraPaths = ["services/core-service", "tests", "."] },
  { root = "tests/ai-service", extraPaths = ["services/ai-service", "tests", "."] },
  { root = "tests/integration", extraPaths = ["services/ai-service", "tests", "."] },
  { root = "." },
]

[tool.pytest.ini_options]

asyncio_mode = "auto"
# Every service's conftest.py has a session-scoped `_schema_ready`
# fixture and a module-level singleton `engine` (database.py) created at
# import time; both assume one event loop for the whole session.
# pytest-asyncio defaults to function-scoped loops, which would leave the
# engine's connections bound to a stale loop ("attached to a different
# loop" errors). Both settings below must be "session" together; setting
# only one creates a loop-scope mismatch.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

markers = [
    "integration: requires `docker compose up` to already be running (tests/integration/)",
]
# Unit tests build Qdrant clients with no Qdrant server
# (e.g. tests/ai-service/test_scripts.py), so qdrant_client's version
# probe warns.
# Only that exact message is ignored; production behaviour is unchanged.
filterwarnings = [
    "ignore:Failed to obtain server version\\. Unable to check client-server compatibility\\.:UserWarning",
    # starlette's TestClient (used by the core WebSocket tests)
    # warns that its httpx backend is deprecated; nothing to fix on our side.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    # passlib (auth-service password hashing) imports the stdlib `crypt`
    # module, deprecated in Python 3.11; harmless until Python 3.13.
    "ignore:'crypt' is deprecated:DeprecationWarning",
]
# No `testpaths` is set on purpose -- each service's tests are run as
# their own invocation (`pytest tests/auth-service`, etc.), never all
# together in one process. See tests/README.md for why.

[tool.uv]

# Both are transitive deps (grpcio via qdrant-client, charset-normalizer
# via requests) -- pinned here only to steer uv's resolver away from
# specific PyPI-yanked releases, not because either is used directly:
# - grpcio 1.82.0 is yanked (bad protobuf dependency version;
#   https://github.com/grpc/grpc/issues/42906); 1.82.1 fixes it.
# - charset-normalizer 3.4.8 is yanked (decode-error regression in its
#   fallback path); 3.4.9 fixes it.
constraint-dependencies = [
    "grpcio>=1.82.1",
    "charset-normalizer>=3.4.9",
]
