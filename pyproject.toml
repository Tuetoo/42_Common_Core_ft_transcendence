[project]
name = "alphamind"
version = "0.1.0"
description = "AlphaMind AI Investment Research Platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "redis>=6.2",
    "qdrant-client>=1.15",
    "langgraph>=0.5",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "openai>=1.97",
    "langchain-anthropic>=0.3",
    "anthropic>=0.58",
    "langchain-mistralai>=0.2",
    "mistralai>=1.9",
    "langchain-google-genai>=2.1",
    "google-genai>=1.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-jose[cryptography]>=3.5",
    "passlib[bcrypt]>=1.7",
    "pyotp>=2.9",
    "authlib>=1.3",
    "httpx>=0.28",
    "orjson>=3.11",
    "python-dotenv>=1.1",
    "structlog>=25.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "websockets>=12.0",
]

[dependency-groups]

dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "black>=25.1",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "types-redis",
]

[tool.ruff]

line-length = 88
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]

select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "C4",     # comprehensions
    "RUF",    # Ruff rules
]

ignore = [
    "B008",
    "UP046",
]

[tool.black]

line-length = 88
target-version = ["py313"]

[tool.mypy]

python_version = "3.13"

strict = true

warn_unused_configs = true

warn_return_any = true

disallow_untyped_defs = true

ignore_missing_imports = true

[tool.pytest.ini_options]

asyncio_mode = "auto"

markers = [
    "integration: requires `docker compose up` to already be running (tests/integration/)",
]
# No `testpaths` set deliberately — each service's tests are run as
# their own invocation (`pytest tests/auth_service`, etc.), never all
# together in one process. See tests/README.md for why.

[tool.uv]