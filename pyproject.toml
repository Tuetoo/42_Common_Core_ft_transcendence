[project]
name = "alphamind-backend"
version = "0.1.0"
description = "AlphaMind AI Investment Research Platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "redis>=6.2",
    "qdrant-client>=1.15",
    "langgraph>=0.5",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "openai>=1.97",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-jose[cryptography]>=3.5",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.28",
    "orjson>=3.11",
    "python-dotenv>=1.1",
    "structlog>=25.4",
]

[dependency-groups]

dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "black>=25.1",
    "mypy>=1.17",
    "pre-commit>=4.2",
]

[tool.ruff]

line-length = 88
target-version = "py313"

exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.black]

line-length = 88
target-version = ["py313"]

[tool.mypy]

python_version = "3.13"

strict = true

warn_unused_configs = true

warn_return_any = true

disallow_untyped_defs = true

ignore_missing_imports = true

[tool.pytest.ini_options]

asyncio_mode = "auto"

testpaths = [
    "tests",
]